description = "藿香 by 藿香开发组\nBuild #22\n《Minecraft》的旧规则里有一件再普通不过的东西——书。它躺在物品栏的角落里，等着被人翻开，等着文字把经验传递下去。\n\n但模组的世界里，知识却常常是散的。你打开一个模组，不懂某个方块的用途，于是切出游戏、打开浏览器、搜索教程、翻看维基，在一堆标签页里来回奔忙。屏幕内外，被切成了两个世界。\n\n藿香（Ageratum），一个为 NeoForge 诞生的小小手册框架，就是想把这两个世界缝在一起。\n\n它为模组开发者提供了一套完整的工具：丰富的 Markdown 渲染，让图文并茂的指引在游戏中自然呈现；可靠的 i18n 国际化，让不同语言的玩家都能读到用自己的文字写下的说明；可扩展的自定义语法与组件机制，让文档不再是死板的文字墙，而是可以长出交互、表格、流程图的活的容器。\n\n旧规则里，书只是一个物品。藿香让它变成了一扇门——开发者把指引写在里面，玩家翻开就能抵达。\n\n没有新增复杂的系统，没有偏离原版的体验。你仍是在翻阅一本书，仍是在方块世界里用自己的双手获取信息。只是这一次，你不必再离开游戏去寻找答案。一切都安静地躺在那本手册里，等你去读。\n\n也许这就是“在旧规则中，创造新体验”。不是推翻什么，而是把知识这株植物，从浏览器那片野地里，轻轻移栽回游戏的土壤之中。藿香，也因此得名——一种扎根泥土、气味清新的草本，安静地生长在属于它的地方。\n\n若你是一位模组开发者，藿香是你的文档落脚之处。\n\n若你是一位玩家，藿香是你探索未知时，触手可及的向导。\n\n在旧规则中，知识也有了新家。"

