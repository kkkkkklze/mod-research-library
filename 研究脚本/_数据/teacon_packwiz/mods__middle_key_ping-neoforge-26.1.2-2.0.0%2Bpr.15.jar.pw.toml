description = "中键标点 by 铁砧工艺开发组-中键标点\nBuild #15\n《Minecraft》的世界很大，大到两个人的相遇往往只差一句“我在哪儿”。我们习惯了打字、开语音、甚至用力跳起来挥剑来吸引注意。但有没有一种方式，可以更安静，却更清楚地告诉对方：我在这里，看那里，小心它。\n\n中键标点模组，就是把“指”这个动作，变成一种默契。\n\n短按中键，一个灰色标记就会落在你准星所指的地方，附上一串精确的距离。\n如果标的是物品——地上那把掉落的钻石剑、矿山洞口旁的一堆火把——那个标记上会直接渲染出物品的图标，看一眼就知道那里有什么。\n如果你标的是一头僵尸、一只苦力怕，标记会变成刺眼的红色，并且会跟随它移动。你不用反复描述“那只苦力怕往东边跑了”，标记追着它，每个人都看得到。\n\n而当事情没那么简单时，长按中键，轮盘浮现在屏幕上：四种颜色，四种信号。你可以圈出一个通用位置，也可以提醒某个地方有敌人，可以为迷路的伙伴指一条前往的路，也可以用注意让所有人停下来看一眼那片可疑的地面。\n\n没有新增复杂的系统，没有改变原版的核心玩法。你只是多了一种表达方式——用光标、用颜色、用轮盘，把“我想告诉你”这件事，变得轻盈而准确。\n\n也许这就是联结。不需要张口，一按，瞄一眼地图，我就知道你在看什么，也知道你想让我看哪里。\n\n若“身边的联系、联结、连接”是主题，那中键标点，就是我们在方块世界里，最敏捷、也最温柔的那根手指。"

