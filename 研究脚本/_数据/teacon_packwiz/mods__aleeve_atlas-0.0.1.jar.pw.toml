description = "袖里舆图 by 天枢开发组\nBuild #18\n袖里舆图，一款或许称不上“好用”的小地图模组。它没有华丽的界面，有些时候反应也不那么灵敏——它能做的很少，但刚好够用：给你一张周围的地形，几颗浮在上面的光标。你的，朋友的，那些你在意的人。\n\n打开它，你就能看见彼此。\n\n光标往东，你知道有人在那片草原上伐木；光标停住了，大概是蹲在矿洞里清点背包。你们不需要语音里反复报坐标，不需要费力描述“我在一棵歪脖子树下”——看一眼地图，就知道谁在哪儿，谁正往这边来。现实中我们也是这样的吧？那些真正亲近的人，你不需要刻意寻找，转身就能看见。\n\n袖里舆图，取自古人把地图揣在袖中、随身携行的意象。我们想让这份地图刚好能躺进你的袖口——独行时替你看看周围，结伴时让你一眼望见同伴。\n\n我们不靠不断堆叠的功能去证明什么。一张地图，几个光标，加在一起，就是“你在哪里，我就在附近”。"

