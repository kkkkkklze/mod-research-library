description = "八角 by 八角开发组\nBuild #18\n《Minecraft》的创造模式物品栏，是一个诞生了十多年的老地方。它的规则很简单：方块、物品、工具，分门别类，排好，等你来取。但当模组把越来越多的自定义物品塞进这个世界，原本的秩序就被打破了——它们藏在角落里，挤在乱糟糟的标签页中，有时候甚至找不到入口。\n\n八角（Anisum），一个名字像调味料的小模组，就是来调理这团乱的。\n\n它只做两件小事：为数据包定义的物品打开一扇通往创造模式的门，让它们堂堂正正地出现在物品栏里；再把那些被打乱的顺序重新理好，让创造栏恢复它本该有的整洁。\n\n你没有离开原版创造模式的规则。你还是打开那个物品栏，还是用同样的方式浏览和拿取。但屏幕上的那几排格子，忽然变得一目了然了——你亲手用数据包打造的那把武器，不再需要敲指令才能拿到；那些模组加进来的千百种方块，也终于不再缠在一起。"

