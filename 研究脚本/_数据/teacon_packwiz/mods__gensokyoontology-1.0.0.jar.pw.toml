description = "幻想存有论 by 拟型悖论 - Pseudoparadox\nBuild #32\n本模组是一个旨在还原幻想乡人物角色、场景地形、战斗探索与建筑结构的冒险类模组，为Minecraft添加了一个幻想乡维度及其附带的多个生物群系，并且为部分生物群系添加了幻想乡特有的建筑结构供玩家探索冒险。玩家需要在主世界处理异变，收集材料，制作道具前往幻想乡，找出发动异变的元凶。"

