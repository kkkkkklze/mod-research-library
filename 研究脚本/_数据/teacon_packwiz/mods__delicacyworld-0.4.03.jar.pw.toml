description = "美食世界-Delicacy'World by CreateNewMarvel-03\nBuild #145\n概念性实验测试，将模拟经营与人气装饰玩法结合进MC模组中进行尝试。玩家将扮演一位餐馆老板，亲自搭建自己喜欢的餐馆样式。并在世界各地收集美食食谱与食材，加入到自己的餐馆菜单中！！！好好做好每一天的食材管理、及时满足顾客的需求。找到适合自己商店的装饰物装饰自己的商店！人气的提升会为你带来更多的客流、店面星级以及营业额！\n 参赛模组为测试DEMO版本，仅开放两个烹饪类型和两个星级以及部分装饰物，且每个局域网世界有且只能进行一个商店经营（可能）"

