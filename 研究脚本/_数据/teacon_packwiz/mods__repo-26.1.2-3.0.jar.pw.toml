description = "会饮 by IEEM 9v8 Trivium Society\nBuild #197\n“会饮”，是古希腊社会普遍流行的一种习俗，即人们在宴会上通过歌颂诸神和饮酒举行庆祝。而中国自古就有以酒会友，宴请亲朋的习俗，甚至发展出了独具一格的宴席和酒桌文化。本模组提供了宴席开展、饮品调理等系统，可以满足各种聚会的建筑和实用需求。"

